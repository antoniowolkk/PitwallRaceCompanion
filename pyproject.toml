[project]
name = "pitwall"
version = "0.1.0"
description = "Pit Wall: local AI race engineer companion for Assetto Corsa Competizione"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "websockets>=13",
    "pyaccsharedmemory>=1.0.0; sys_platform == 'win32'",
    "piper-tts>=1.8.0",
]

[project.scripts]
pitwall = "pitwall.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pitwall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
