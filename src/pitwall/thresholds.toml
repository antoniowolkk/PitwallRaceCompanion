# Pit Wall thresholds.

[tyres]
# Core temperature window in °C for GT3 dry tyres. Sources disagree (65-80 vs 80-90);
# 80-90 fits the Ferrari 296 GT3 at Spa, 2026-10-27: fronts ~82, rears ~87 on race laps.
temp_c = [80.0, 90.0]
# Hot pressure window in psi for GT3 dry tyres: ACC's target since v1.9 (DHE tyre update).
# Kept strict on purpose: the Spa race ran 27.2-27.3, which is a setup fix, not a wrong window.
pressure_psi = [26.0, 27.0]

[tyres_wet]
# Used whenever ACC says the car is on wet tyres. Pressure: 29.5-31.0 psi is the window the
# guides agree on (Coach Dave Academy, simracingsetup.com). Temperature: no reliable source;
# set so the wet Spa race on 2026-10-28 (Porsche 992, fronts ~62, rears ~73 C on race laps)
# reads OK. Tune it after more wet running.
temp_c = [55.0, 80.0]
pressure_psi = [29.5, 31.0]

[fuel]
# Fuel tile turns to warning below this many laps left; the radio calls at the same points.
warn_laps = 3.0
critical_laps = 1.5

[pit]
# Warn this long before the mandatory pit window closes if the stop is still to do.
closing_warn_s = 120.0

[calls]
# A hot tyre or high pressure must last this long before a call, so one kerb does not trigger it.
tyre_sustain_s = 10.0
# Minimum time between two calls of the same kind.
tyre_cooldown_s = 300.0
flag_cooldown_s = 15.0
# Blue flags come and go for one faster car; once a minute is enough.
blue_cooldown_s = 60.0
# A flag must show this long before it is called: ACC flickers flags for 0.1-0.8 s
# (Spa wet race, 2026-10-28: yellow 0.1 s, blue 0.4 s, green 0.8 s).
flag_hold_s = 1.0
# Fuel critical repeats each lap, but not twice in a row when it crosses near the line.
fuel_cooldown_s = 30.0
# Radio queue: gap between calls (urgent calls skip it); queued calls older than this are dropped.
spacing_s = 4.0
expire_s = 15.0

[track]
# Tracks without official turns in tracks.toml: a turn is a speed dip of at least this much,
# the slowest point within this share of the lap either side,
turn_drop_kmh = 25.0
turn_window = 0.03
# and the turn spans this many metres either side of that point.
turn_half_m = 60.0

[tips]
# Per-turn tips. A pass through a turn is timed from pre_m before it to post_m after it.
pre_m = 150.0
post_m = 150.0
# Say the tip this many seconds before the turn at the current speed, but at least
# min_lead_m before it; closer than min_gap_m (the previous turn ran too close) it is skipped.
lead_s = 5.0
min_lead_m = 150.0
min_gap_m = 60.0
# ACC wheel slip is about 1 in normal hard braking and 3-5 when a wheel locks
# (Spa out lap, Bruxelles). It must show on this many samples (10 Hz) to count.
lock_slip = 3.0
spin_slip = 3.0
spin_throttle = 0.5
slip_samples = 2
# A steering reversal inside a turn counts when the wheel moves back by this much
# (ACC steer is -1..1). A clean corner has about one: turn in, then unwind.
steer_swing = 0.04
# A clean pass this much slower than the best one through that turn is worth a word.
loss_s = 0.5
# In practice and qualifying: at most this many tips a lap.
max_per_lap = 1
# In a race only these, and at least this many laps apart.
race_kinds = ["tip_lockup", "tip_off"]
race_gap_laps = 3
# A tip not started within this many seconds is dropped: late is worse than never.
expire_s = 2.0

[style]
# Driving style per turn, against the best clean pass through that turn. A difference this
# big counts: braking this many metres earlier, this much lower minimum speed, this much
# more coasting, full throttle this many metres later.
brake_m = 20.0
min_kmh = 5.0
coast_s = 0.3
full_m = 20.0
# After a session: a turn needs this many passes, and a habit this many of them, to be a pattern.
min_passes = 3
min_repeats = 2
# Sessions that personal tips learn from (user's choice: qualifying only; race laps are
# shaped by traffic). Add "practice" or "hotlap" here to learn from those too.
learn_from = ["qualify"]
# Session style summary (Coach screen, kept for the setup advisor): a trait is "worth a look"
# at these levels. Needs summary_passes turn passes first.
summary_passes = 10
lockup_rate = 0.1
wheelspin_rate = 0.05
steer_extra = 0.7
coast_avg_s = 0.4
cuts = 3
spread_s = 1.0
front_hot_c = 5.0

[coach]
# Stint coach (phase 4): tips after a lap, said on the next straight.
# No tip before this many clean laps in the stint (PRD default 3); at most this many a stint.
min_clean_laps = 3
max_per_stint = 2
# Coach tips in races too? Off: in a race only the per-turn lockup/cut tips speak.
race = false
# The rules look at the last window_laps laps of the stint. A rule fires at:
window_laps = 3
lockups = 3  # lockups in the window
wheelspin = 3  # wheelspin turns in the window
steer_extra = 1.0  # extra steering reversals per turn, against the cleanest pass (dry only)
front_hot_c = 5.0  # fronts this much hotter than the rears on the last lap (rears run hotter normally)
spread_laps = 5  # lap time spread over the last 5 clean laps
spread_s = 1.0
# Praise a clean lap this close to the best clean lap (not a new best: that has its own call).
praise_within_s = 0.3
# Speak only on a straight: at least safe_s seconds (and safe_min_m) before the next turn.
safe_s = 6.0
safe_min_m = 200.0
# A coach line not started within this many seconds (radio busy) is dropped.
expire_s = 5.0
